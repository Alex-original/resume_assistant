<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>求职助手 · 登录</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-brand">
    <span class="brand-dot"></span>
    <span class="brand-name">求职助手</span>
  </div>

  <div class="auth-card">
    <label class="fld">
      <span>手机号</span>
      <input type="tel" id="phone" inputmode="numeric" autocomplete="tel"
             maxlength="11" placeholder="11 位手机号">
    </label>

    <label class="fld">
      <span>验证码</span>
      <div class="code-row">
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="6 位数字">
        <button class="btn btn--soft code-btn" id="send">发送验证码</button>
      </div>
    </label>

    <div class="notice notice--danger" id="err" hidden></div>
    <div class="notice notice--info" id="hint" hidden></div>

    <button class="btn btn--primary btn--block btn--lg" id="submit">登录 / 注册</button>

    <p class="auth-note">
      没注册过会自动创建账号。<br>
      每个人有自己独立的数据空间——简历、面试记录、材料都只有你自己能看到。
    </p>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
let timer = null;

function fail(msg) {
  const box = $('#err');
  box.textContent = msg;
  box.hidden = false;
  $('#hint').hidden = true;
}

function hint(msg) {
  const box = $('#hint');
  box.textContent = msg;
  box.hidden = false;
  $('#err').hidden = true;
}

async function sendCode() {
  const phone = $('#phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { fail('请输入正确的 11 位手机号'); return; }

  const btn = $('#send');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/send-code', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '发送失败');

    hint(data.message + (data.dev_code ? `　验证码：${data.dev_code}` : ''));

    // 60 秒倒计时，和发送间隔对齐——不然用户点了会收到「太频繁」
    let s = 60;
    btn.textContent = `${s}s 后重发`;
    timer = setInterval(() => {
      s -= 1;
      if (s <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '发送验证码';
      } else {
        btn.textContent = `${s}s 后重发`;
      }
    }, 1000);
  } catch (e) {
    fail(e.message);
    btn.disabled = false;
    btn.textContent = '发送验证码';
  }
}

async function submit() {
  const phone = $('#phone').value.trim();
  const code = $('#code').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { fail('请输入正确的 11 位手机号'); return; }
  if (!/^\d{6}$/.test(code)) { fail('请输入 6 位验证码'); return; }

  const btn = $('#submit');
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone, code }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '登录失败');
    location.href = '/';
  } catch (e) {
    fail(e.message);
    btn.disabled = false;
    btn.textContent = '登录 / 注册';
  }
}

$('#send').onclick = sendCode;
$('#submit').onclick = submit;
$('#phone').onkeydown = (e) => { if (e.key === 'Enter') $('#code').focus(); };
$('#code').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
$('#phone').focus();
</script>
</body>
</html>
