server {
    # ════════════════════════════════════════════════════════
    #  resume_assistant.videotonote.cn
    #
    #  这台机器上已经有 nginx 在跑 trade.videotonote.cn，所以不再另起 Caddy，
    #  直接复用现有 nginx 做反代：应用容器只监听 127.0.0.1:7870，不对外。
    #
    #  安装位置：/etc/nginx/sites-available/resume_assistant
    #  启用：    ln -s ../sites-available/resume_assistant /etc/nginx/sites-enabled/
    # ════════════════════════════════════════════════════════

    listen 80;
    listen [::]:80;
    server_name resume_assistant.videotonote.cn;

    # certbot 会把这个 location 改成跳 HTTPS；先留着让验证能过
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name resume_assistant.videotonote.cn;

    # 证书由 certbot 签发后填这里（脚本会自动替换）
    ssl_certificate     /etc/letsencrypt/live/resume_assistant.videotonote.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume_assistant.videotonote.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 上传简历截图、PDF、zip 都在这个量级以内
    client_max_body_size 32m;

    # 别让搜索引擎收录私人简历
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/resume_assistant.access.log;
    error_log  /var/log/nginx/resume_assistant.error.log;

    location / {
        proxy_pass http://127.0.0.1:7870;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 语音是流式返回的（边合成边播）。nginx 默认会缓冲，
        # 一缓冲首字节 0.45 秒的优势就没了，又变回 3 秒的"生硬"。
        proxy_buffering off;
        proxy_cache off;

        # AI 出题、复盘一次要 30~60 秒，别提前掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }
}
