# ════════════════════════════════════════════════════════
#  resume.videotonote.cn  —— 求职助手
#
#  这台机器上已经有 nginx 在跑 trade.videotonote.cn，所以不另起 Caddy，
#  直接复用现有 nginx 反代到应用的 127.0.0.1:7870。
#
#  安装：/etc/nginx/sites-available/resume-assistant
#  启用：ln -s ../sites-available/resume-assistant /etc/nginx/sites-enabled/
#
#  注意：域名不能带下划线！公共 CA 不给含 "_" 的主机名签证书
#  （试过 resume_assistant.videotonote.cn，Let's Encrypt 直接拒绝：
#   Domain name contains an invalid character）。
# ════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name resume.videotonote.cn;

    # certbot 续期时走这里（HTTP-01 验证）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name resume.videotonote.cn;

    ssl_certificate     /etc/letsencrypt/live/resume.videotonote.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume.videotonote.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 传简历截图、项目 zip 用
    client_max_body_size 32m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/resume.access.log;
    error_log  /var/log/nginx/resume.error.log;

    location / {
        proxy_pass http://127.0.0.1:7870;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 语音是流式返回的（边合成边播）。nginx 默认缓冲，
        # 一缓冲首字节 0.45 秒的优势就没了，又变回 3 秒的"生硬"。
        proxy_buffering off;
        proxy_cache off;

        # AI 出题、复盘一次 30~60 秒，别提前掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }
}
